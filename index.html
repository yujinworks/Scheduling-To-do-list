<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마감 한눈에 비교</title>
<style>
  :root {
    --bg: #f7f6f2;
    --card: #ffffff;
    --ink: #1f2430;
    --sub: #5d6472;
    --line: #e3e1d9;
    --accent: #2f5d50;
    --accent-ink: #ffffff;
    --soft: #e9f0ed;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }

  h1 { font-size: 1.75rem; line-height: 1.3; margin: 0 0 12px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 28px; color: var(--sub); font-size: 1.02rem; }

  .btn {
    display: block; width: 100%;
    min-height: 56px;
    padding: 14px 20px;
    font: inherit; font-size: 1.08rem; font-weight: 700;
    color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 14px; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 3px solid #8fb8aa; outline-offset: 3px; }

  .note { margin: 10px 2px 0; font-size: 0.88rem; color: var(--sub); }

  #result { margin-top: 24px; }
  #result[hidden] { display: none; }
  .result-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 10px; }
  .result-head h2 { margin: 0; font-size: 1.05rem; }
  .tag {
    font-size: 0.78rem; font-weight: 700; color: var(--accent);
    background: var(--soft); padding: 2px 10px; border-radius: 999px;
  }

  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px;
    align-items: center;
  }
  .dday { grid-row: span 2; text-align: center; min-width: 64px; }
  .dday b { display: block; font-size: 1.6rem; line-height: 1.1; color: var(--accent); }
  .dday span { font-size: 0.78rem; color: var(--sub); }
  .name { font-weight: 700; }
  .date { font-size: 0.85rem; color: var(--sub); }
  .prep { grid-column: 1 / -1; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 0.95rem; }
  .prep em { font-style: normal; font-size: 0.8rem; color: var(--sub); margin-right: 6px; }

  .later { margin-top: 36px; display: grid; gap: 12px; }
  .slot {
    border: 1.5px dashed var(--line); border-radius: 14px; padding: 14px 16px;
    background: transparent;
  }
  .slot h3 { margin: 0 0 4px; font-size: 0.98rem; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .slot p { margin: 0; font-size: 0.88rem; color: var(--sub); }
  .badge {
    font-size: 0.72rem; font-weight: 700; color: var(--sub);
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; background: #fff;
  }
  .slot input {
    width: 100%; margin-top: 10px; padding: 12px; font: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: #f0efe9; color: var(--sub);
  }

  @media (min-width: 560px) {
    .wrap { padding-top: 64px; }
    h1 { font-size: 2.1rem; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>여러 일정, 마감일과 준비할 내용을 한눈에 비교하세요</h1>
  <p class="lead">달력에서 일정을 하나씩 눌러 보지 않아도, 버튼 한 번으로 마감까지 남은 날짜와 준비할 내용을 가까운 마감순으로 볼 수 있어요.</p>

  <button class="btn" id="openBtn" type="button" aria-expanded="false" aria-controls="result">마감순으로 펼쳐 보기</button>
  <p class="note">지금 보이는 일정은 모두 예시 값입니다.</p>

  <section id="result" hidden aria-live="polite">
    <div class="result-head">
      <h2>가까운 마감순</h2>
      <span class="tag">예시</span>
    </div>
    <ol id="list"></ol>
  </section>

  <section class="later" aria-label="나중에 연결할 기능">
    <div class="slot">
      <h3>내 일정 직접 입력 <span class="badge">나중에 연결</span></h3>
      <p>입력한 일정을 보관하는 저장 기능이 들어갈 자리입니다.</p>
      <input type="text" value="" placeholder="일정 입력 (아직 사용할 수 없어요)" disabled aria-disabled="true">
    </div>
    <div class="slot">
      <h3>실시간 정보 <span class="badge">나중에 연결</span></h3>
      <p>이 페이지에는 실시간 정보가 필요하지 않아 비워 둔 자리입니다.</p>
    </div>
  </section>
</main>

<script>
(function () {
  // 예시 값: 오늘 날짜를 기준으로 며칠 뒤인지만 정해 둔 값입니다. (일부러 순서를 섞어 두었어요)
  var samples = [
    { name: "예시 일정 B", offset: 12, prep: "준비할 내용 예시 B" },
    { name: "예시 일정 A", offset: 3,  prep: "준비할 내용 예시 A" },
    { name: "예시 일정 C", offset: 7,  prep: "준비할 내용 예시 C" }
  ];

  var DAY = 24 * 60 * 60 * 1000;
  var today = new Date();
  today.setHours(0, 0, 0, 0);

  var items = samples.map(function (s) {
    var d = new Date(today.getTime() + s.offset * DAY);
    return { name: s.name, prep: s.prep, date: d, left: Math.round((d - today) / DAY) };
  }).sort(function (a, b) { return a.left - b.left; });

  function fmt(d) {
    var w = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + w + ")";
  }

  var list = document.getElementById("list");
  items.forEach(function (it) {
    var li = document.createElement("li");
    li.className = "item";
    li.innerHTML =
      '<div class="dday"><b>' + (it.left === 0 ? "오늘" : "D-" + it.left) + '</b><span>' + it.left + '일 남음</span></div>' +
      '<div><div class="name"></div><div class="date"></div></div>' +
      '<div class="prep"><em>준비할 내용</em><span></span></div>';
    li.querySelector(".name").textContent = it.name;
    li.querySelector(".date").textContent = "마감 " + fmt(it.date);
    li.querySelector(".prep span").textContent = it.prep;
    list.appendChild(li);
  });

  var btn = document.getElementById("openBtn");
  var result = document.getElementById("result");
  btn.addEventListener("click", function () {
    var open = result.hidden;
    result.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
    btn.textContent = open ? "접기" : "마감순으로 펼쳐 보기";
  });
})();
</script>
</body>
</html>
